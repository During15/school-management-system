<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>School Reports</h1>
    <p>Generate and view school management reports</p>
</header>

<main>

    <section>
        <h2>Generate Report</h2>

        <form>
            <label for="reportType">Report Type:</label><br>
            <select id="reportType" required>
                <option value="">Select Report</option>
                <option>Student Report</option>
                <option>Attendance Report</option>
                <option>Grades Report</option>
                <option>Fees Report</option>
                <option>Staff Report</option>
            </select>

            <br><br>

            <label for="dateFrom">From:</label><br>
            <input type="date" id="dateFrom">

            <br><br>

            <label for="dateTo">To:</label><br>
            <input type="date" id="dateTo">

            <br><br>

            <button type="submit">Generate Report</button>
        </form>
    </section>

    <section>
        <h2>Recent Reports</h2>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Report</th>
                    <th>Date</th>
                    <th>Generated By</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Student Report</td>
                    <td>2026-08-28</td>
                    <td>Administrator</td>
                    <td>Ready</td>
                </tr>

                <tr>
                    <td>Attendance Report</td>
                    <td>2026-08-28</td>
                    <td>Teacher</td>
                    <td>Ready</td>
                </tr>
            </tbody>
        </table>
    </section>

</main>

<footer>
    <p>&copy; 2026 School Management System</p>
</footer>

</body>
</html>
