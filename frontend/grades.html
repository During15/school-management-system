<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Grades Management</h1>
    <p>Manage student examination results</p>
</header>

<main>
    <section>
        <h2>Student Results</h2>

        <table border="1" width="100%" cellpadding="10">
            <thead>
                <tr>
                    <th>Student Number</th>
                    <th>Student Name</th>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Grade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>STU001</td>
                    <td>Example Student</td>
                    <td>Mathematics</td>
                    <td>85</td>
                    <td>A</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
