<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Exam Management</h1>
    <p>Create, schedule and manage school examinations</p>
</header>

<main>

    <section>
        <h2>Create New Exam</h2>

        <form>
            <label for="examName">Exam Name:</label><br>
            <input type="text" id="examName" placeholder="e.g. Mid-Term Examination" required>
            <br><br>

            <label for="subject">Subject:</label><br>
            <select id="subject" required>
                <option value="">Select Subject</option>
                <option>Mathematics</option>
                <option>English</option>
                <option>Computer Science</option>
                <option>Physics</option>
                <option>Biology</option>
            </select>
            <br><br>

            <label for="class">Class:</label><br>
            <select id="class" required>
                <option value="">Select Class</option>
                <option>Grade 10</option>
                <option>Grade 11</option>
                <option>Grade 12</option>
            </select>
            <br><br>

            <label for="examDate">Exam Date:</label><br>
            <input type="date" id="examDate" required>
            <br><br>

            <label for="totalMarks">Total Marks:</label><br>
            <input type="number" id="totalMarks" placeholder="100" min="1" required>
            <br><br>

            <button type="submit">Create Exam</button>
        </form>
    </section>

    <section>
        <h2>Scheduled Exams</h2>

        <table border="1" width="100%">
            <thead>
                <tr>
                    <th>Exam</th>
                    <th>Subject</th>
                    <th>Class</th>
                    <th>Date</th>
                    <th>Total Marks</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Mid-Term Examination</td>
                    <td>Mathematics</td>
                    <td>Grade 10</td>
                    <td>2026-09-15</td>
                    <td>100</td>
                    <td>Scheduled</td>
                </tr>
